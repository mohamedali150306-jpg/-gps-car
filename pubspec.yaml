name: robocar_controller
description: GPS Robot Car controller - USB link to the bridge ESP32 (ESP-NOW to the car)
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  usb_serial: ^0.5.1            # USB OTG serial to the bridge ESP32
  geolocator: ^10.1.0           # phone GPS position for Home
  shared_preferences: ^2.2.2    # saved places
  permission_handler: 10.4.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
